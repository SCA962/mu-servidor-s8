name: Imagen del servidor OpenMU con contenido Season 8

# Compila la imagen en GitHub, nunca en la maquina de Mundy.
# Deja la imagen como artefacto para bajarla y cargarla con docker load en el lab.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  imagen:
    name: OpenMU + contenido S8 (Acheron y Debenter)
    runs-on: ubuntu-latest

    steps:
      - name: Receta y parche (este repositorio)
        uses: actions/checkout@v4
        with:
          path: receta

      - name: Codigo de OpenMU en el commit exacto del parche
        uses: actions/checkout@v4
        with:
          repository: MUnique/OpenMU
          ref: 9693f8f6cf037909c9dfd3a9a9438fffcabd9837
          path: OpenMU

      - name: Aplicar el parche
        working-directory: OpenMU
        run: |
          echo "commit base: $(git rev-parse HEAD)"
          git apply --check ../receta/s8-servidor.patch
          git apply ../receta/s8-servidor.patch
          git diff --stat
          test -f src/Persistence/Initialization/VersionSeasonSix/Maps/Acheron.cs || { echo "falta Acheron.cs" >&2; exit 1; }
          test -f src/Persistence/Initialization/VersionSeasonSix/Maps/Debenter.cs || { echo "falta Debenter.cs" >&2; exit 1; }
          test -f src/Persistence/Initialization/Resources/Terrain92.att || { echo "falta el terreno de Acheron" >&2; exit 1; }
          test -f src/Persistence/Initialization/Resources/Terrain96.att || { echo "falta el terreno de Debenter" >&2; exit 1; }
          grep -q "typeof(Acheron)" src/Persistence/Initialization/VersionSeasonSix/GameMapsInitializer.cs || { echo "los mapas no quedaron registrados" >&2; exit 1; }
          grep -q "MaximumMasterLevel = 330" src/Persistence/Initialization/GameConfigurationInitializerBase.cs || { echo "falta el tope de master" >&2; exit 1; }
          grep -q "CreateExitGate(maps\[91\], 052, 190, 060, 194, 1, true)" src/Persistence/Initialization/VersionSeasonSix/Gates.cs || { echo "la puerta de llegada de Acheron no es la buena" >&2; exit 1; }
          # contenido nuevo: arbol maestro 6-9 e items del S8
          test -f src/Persistence/Initialization/Updates/AddSeason8MasterSkillTreePlugIn.cs || { echo "falta el plugin del arbol maestro" >&2; exit 1; }
          test -f src/Persistence/Initialization/Updates/AddSeasonEightItemsAndDropsUpdatePlugIn.cs || { echo "falta el plugin de items y drops" >&2; exit 1; }
          test "$(grep -c "AddMasterSkillDefinition" src/Persistence/Initialization/VersionSeasonSix/SkillsInitializer.cs)" -ge 103 || { echo "no estan las 103 skills maestras" >&2; exit 1; }
          grep -q "AddSeasonEightItemsAndDrops = 116" src/Persistence/Initialization/Updates/UpdateVersion.cs || { echo "los dos plugins de actualizacion chocan de version" >&2; exit 1; }
          # sin esto el terreno no se carga y todo lo que este en y >= 128 queda bloqueado
          grep -q "EmbeddedResource Include=\"Resources\\\\Terrain92.att\"" src/Persistence/Initialization/MUnique.OpenMU.Persistence.Initialization.csproj || { echo "el terreno de Acheron no esta declarado como recurso" >&2; exit 1; }
          grep -q "EmbeddedResource Include=\"Resources\\\\Terrain96.att\"" src/Persistence/Initialization/MUnique.OpenMU.Persistence.Initialization.csproj || { echo "el terreno de Debenter no esta declarado como recurso" >&2; exit 1; }
          test "$(grep -c "maps\[9[15]\].EnterGates.Add" src/Persistence/Initialization/VersionSeasonSix/Gates.cs)" = "6" || { echo "faltan las puertas que se pisan de Acheron y Debenter" >&2; exit 1; }
          grep -q "CreateJinStore" src/Persistence/Initialization/VersionSeasonSix/Maps/Acheron.cs || { echo "falta la tienda de Jin" >&2; exit 1; }
          # Sir Lesnar tiene que estar definido en NpcInitialization, que corre antes que los mapas
          grep -q "def.Number = 584;" src/Persistence/Initialization/VersionSeasonSix/NpcInitialization.cs || { echo "Sir Lesnar no esta definido antes que los mapas" >&2; exit 1; }
          test "$(grep -rc "NpcDictionary\[584\]" src/Persistence/Initialization/VersionSeasonSix/Maps/Lorencia.cs src/Persistence/Initialization/VersionSeasonSix/Maps/Devias.cs src/Persistence/Initialization/VersionSeasonSix/Maps/Noria.cs | grep -c ":1")" = "3" || { echo "Sir Lesnar no esta en los tres pueblos" >&2; exit 1; }
          # --- mineria Jewel of Pandora ---
          # los .cs del protocolo tienen que viajar generados: la compilacion corre con ci=true y no regenera nada
          grep -q "struct MiningHitRequest" src/Network/Packets/ClientToServer/ClientToServerPackets.cs || { echo "el protocolo de mineria no esta generado (ClientToServerPackets.cs)" >&2; exit 1; }
          grep -q "struct MiningHitResult" src/Network/Packets/ServerToClient/ServerToClientPackets.cs || { echo "el protocolo de mineria no esta generado (ServerToClientPackets.cs)" >&2; exit 1; }
          grep -q "SendMiningHitResultAsync" src/Network/Packets/ServerToClient/ConnectionExtensions.cs || { echo "falta el metodo de envio de la mineria" >&2; exit 1; }
          # las zonas van con su propio NpcObjectKind, no como monstruos
          grep -q "MiningZone," src/DataModel/Configuration/MonsterDefinition.cs || { echo "falta NpcObjectKind.MiningZone" >&2; exit 1; }
          grep -q "new MiningZone(spawnArea" src/GameLogic/MapInitializer.cs || { echo "MapInitializer no sabe crear la zona de mineria" >&2; exit 1; }
          test -f src/GameLogic/NPC/MiningZone.cs || { echo "falta la clase MiningZone" >&2; exit 1; }
          test -f src/GameLogic/Mining/MiningTable.cs || { echo "falta la tabla de mineria" >&2; exit 1; }
          test -f src/GameLogic/PlayerActions/Mining/MiningAction.cs || { echo "falta la accion de mineria" >&2; exit 1; }
          # las tres definiciones y las 42 colocaciones
          test "$(grep -c "Mining Area" src/Persistence/Initialization/VersionSeasonSix/NpcInitialization.cs)" -ge 6 || { echo "no estan las tres zonas definidas antes que los mapas" >&2; exit 1; }
          test "$(grep -rh "NpcDictionary\[60[567]\]" src/Persistence/Initialization/VersionSeasonSix/Maps/ | wc -l)" = "42" || { echo "no son 42 colocaciones de zona de mineria" >&2; exit 1; }
          grep -q "typeof(Tarkan);" src/Persistence/Initialization/VersionSeasonSix/GameMapsInitializer.cs || { echo "Tarkan no apunta a la subclase de Season 6" >&2; exit 1; }
          # el sumidero: el pico no se repara con dinero y cada Bless le da 4 puntos
          grep -q "IsRepairedOnlyWithJewels" src/GameLogic/PlayerActions/Items/ItemRepairAction.cs || { echo "el pico se podria reparar con dinero" >&2; exit 1; }
          grep -q "IsPandoraPick" src/GameLogic/PlayerActions/ItemConsumeActions/BlessJewelConsumeHandlerPlugIn.cs || { echo "el pico no se repara con Jewel of Bless" >&2; exit 1; }
          grep -q "pandoraPick.Durability = 1;" src/Persistence/Initialization/VersionSeasonSix/MerchantStores.cs || { echo "el pico de la tienda de Bolo no sale con durabilidad 1" >&2; exit 1; }
          # el plugin de actualizacion para la base viva, sin chocar de version
          test -f src/Persistence/Initialization/Updates/AddPandoraMiningSystemUpdatePlugIn.cs || { echo "falta el plugin de actualizacion de la mineria" >&2; exit 1; }
          grep -q "AddPandoraMiningSystem = 117" src/Persistence/Initialization/Updates/UpdateVersion.cs || { echo "la version del plugin de mineria choca" >&2; exit 1; }
          # --- los cinco mapas que faltaban del S8 ---
          for m in Acheron2 Debenter2 ChaosCastleFinal IllusionTempleFinal1 IllusionTempleFinal2; do
            test -f "src/Persistence/Initialization/VersionSeasonSix/Maps/$m.cs" || { echo "falta el mapa $m" >&2; exit 1; }
            grep -q "typeof($m)" src/Persistence/Initialization/VersionSeasonSix/GameMapsInitializer.cs || { echo "el mapa $m no esta registrado" >&2; exit 1; }
          done
          # el terreno es la trampa: GetTerrainFileName busca Terrain{N+1} y si no esta VA BAJANDO,
          # asi que sin estos ficheros el 97 se queda sin terreno y el 98 y el 99 cargan el de Debenter
          for t in 93 97 98 99 100; do
            test -f "src/Persistence/Initialization/Resources/Terrain$t.att" || { echo "falta Resources/Terrain$t.att" >&2; exit 1; }
            grep -q "EmbeddedResource Include=\"Resources\\\\Terrain$t.att\"" src/Persistence/Initialization/MUnique.OpenMU.Persistence.Initialization.csproj || { echo "Terrain$t.att no esta declarado en el csproj" >&2; exit 1; }
          done
          # el bono de conjunto de las armaduras del S8: BuildSets tiene que ir DESPUES de crearlas
          test "$(grep -n 'this.BuildSets();' src/Persistence/Initialization/VersionSeasonSix/Items/Armors.cs | cut -d: -f1)" -gt "$(grep -n 'Season 8: armaduras nuevas' src/Persistence/Initialization/VersionSeasonSix/Items/Armors.cs | cut -d: -f1)" \
            || { echo "BuildSets sigue corriendo antes de las armaduras del S8" >&2; exit 1; }

          # --- sistema elemental: pentagramas y errtels ---
          grep -q "PentagramSlot = 236" src/DataModel/InventoryConstants.cs || { echo "falta el hueco 236 del pentagrama" >&2; exit 1; }
          grep -q "IsEquippedSlot" src/GameLogic/ItemPowerUpFactory.cs || { echo "la fabrica de atributos sigue ignorando el hueco 236" >&2; exit 1; }
          test -f src/GameLogic/PentagramStorage.cs || { echo "falta PentagramStorage" >&2; exit 1; }
          test -f src/Persistence/Initialization/VersionSeasonSix/Items/Pentagrams.cs || { echo "falta el inicializador de pentagramas" >&2; exit 1; }
          grep -q "new Pentagrams(this.Context" src/Persistence/Initialization/VersionSeasonSix/GameConfigurationInitializer.cs || { echo "los pentagramas no estan registrados" >&2; exit 1; }
          grep -q "InventoryConstants.PentagramSlot" src/Persistence/Initialization/Version075/Items/SlotTypesInitializer.cs || { echo "falta el tipo de hueco del pentagrama" >&2; exit 1; }
          grep -q "ItemOptionType PentagramElement" src/DataModel/Configuration/Items/ItemOptionTypes.cs || { echo "falta el tipo de opcion del elemento" >&2; exit 1; }
          # los 15 pentagramas, los 5 errtels y las 60 filas de opcion, tal cual el paquete S8
          test "$(grep -c "this.CreatePentagram(" src/Persistence/Initialization/VersionSeasonSix/Items/Pentagrams.cs)" = "15" || { echo "no son 15 pentagramas" >&2; exit 1; }
          test "$(grep -c "this.CreateErrtel(" src/Persistence/Initialization/VersionSeasonSix/Items/Pentagrams.cs)" = "5" || { echo "no son 5 errtels" >&2; exit 1; }
          test "$(grep -c "this.CreateErrtelOption(" src/Persistence/Initialization/VersionSeasonSix/Items/Pentagrams.cs)" = "60" || { echo "no son 60 filas de opcion de errtel" >&2; exit 1; }
          # los atributos: 283 de OpenMU + 38 del sistema elemental, y ninguno con GUID repetido
          # (la resistencia a la oscuridad se quito: nadie la leia y la rueda usa matrices, no resistencias)
          test "$(grep -c "public static AttributeDefinition" src/GameLogic/Attributes/Stats.cs)" = "321" || { echo "el numero de atributos no es el esperado" >&2; exit 1; }
          test -z "$(grep -oE 'new Guid\("[0-9A-Fa-f-]+"\)' src/GameLogic/Attributes/Stats.cs | sort | uniq -d)" || { echo "hay GUID repetidos en Stats.cs" >&2; exit 1; }
          # el canal de dano en los dos sentidos, y los valores elementales de los bichos
          test -f src/GameLogic/ElementalCombat.cs || { echo "falta el motor de dano elemental" >&2; exit 1; }
          grep -q "ElementalCombat.CalculateDamage" src/GameLogic/AttackableExtensions.cs || { echo "el dano elemental no esta enganchado al calculo de dano" >&2; exit 1; }
          grep -q "ElementalCombat.IsImmuneToPhysicalDamage" src/GameLogic/AttackableExtensions.cs || { echo "los jefes elementales siguen recibiendo dano fisico" >&2; exit 1; }
          test -f src/Persistence/Initialization/VersionSeasonSix/ElementalSystem.cs || { echo "faltan los valores elementales de los bichos" >&2; exit 1; }
          grep -q "new ElementalSystem(this.Context" src/Persistence/Initialization/VersionSeasonSix/GameConfigurationInitializer.cs || { echo "el sistema elemental no esta registrado" >&2; exit 1; }
          # 39 bichos con elemento propio (el 657 queda fuera: sus cifras del paquete estan toqueteadas)
          test "$(grep -cE "^        [0-9]+, [0-9]+, [0-9]+, [0-9]+, [0-9]+, [0-9]+, [0-9]+, //" src/Persistence/Initialization/VersionSeasonSix/ElementalSystem.cs)" = "39" || { echo "no son 39 bichos elementales" >&2; exit 1; }
          # los dos comandos: el hueco 236 el cliente no lo dibuja, y las mezclas del errtel no se
          # pueden hacer en la Maquina del Caos porque el cliente no manda nada si la receta no
          # esta en su Data/Local/Mix.bmd
          test -f src/GameLogic/ErrtelHelper.cs || { echo "falta ErrtelHelper" >&2; exit 1; }
          grep -q "/pentagrama" src/GameLogic/PlugIns/ChatCommands/PentagramChatCommandPlugIn.cs || { echo "falta el comando del pentagrama" >&2; exit 1; }
          grep -q "/errtel" src/GameLogic/PlugIns/ChatCommands/ErrtelChatCommandPlugIn.cs || { echo "falta el comando del errtel" >&2; exit 1; }
          grep -q "CompliesRequirements" src/GameLogic/PlugIns/ChatCommands/PentagramChatCommandPlugIn.cs || { echo "el pentagrama se equiparia sin cumplir el nivel" >&2; exit 1; }
          # EL BLOQUEANTE de la revision: con boxOffset 0 la rejilla mide 0 filas y el pentagrama
          # NO entra nunca, sin ningun error. Tiene que ser 1, como InventoryStorage con sus 12.
          grep -qE "^            1,\s*$" src/GameLogic/PentagramStorage.cs || { echo "PentagramStorage no lleva boxOffset 1" >&2; exit 1; }
          test "$(grep -cE "^            1,\s*$" src/GameLogic/PentagramStorage.cs)" = "2" || { echo "PentagramStorage: se esperan numberOfSlots=1 y boxOffset=1" >&2; exit 1; }
          grep -q "RefreshAsync" src/GameLogic/PentagramStorage.cs || { echo "sin RefreshAsync los atributos no se rehacen al montar un errtel" >&2; exit 1; }
          # la fila de Undine venia manipulada igual que la del 657
          grep -q "592, 2, 2, 472, 496, 950, 315," src/Persistence/Initialization/VersionSeasonSix/ElementalSystem.cs || { echo "Undine sigue con los numeros manipulados del paquete" >&2; exit 1; }
          # sin AddsRandomly el generador de drops no le pone NADA al item: el pentagrama saldria sin
          # elemento y el errtel sin opciones, los dos inutiles y sin avisar
          test "$(grep -c "AddsRandomly = true" src/Persistence/Initialization/VersionSeasonSix/Items/Pentagrams.cs)" = "26" || { echo "faltan opciones que se repartan al caer (1 elemento + 25 rangos de errtel)" >&2; exit 1; }
          grep -q "EnsureElement" src/GameLogic/PlugIns/ChatCommands/PentagramChatCommandPlugIn.cs || { echo "un pentagrama creado por comando se quedaria sin elemento" >&2; exit 1; }
          # los drops
          grep -q "Pentagrams (elemental bosses)" src/Persistence/Initialization/VersionSeasonSix/ElementalSystem.cs || { echo "faltan los drops de pentagrama" >&2; exit 1; }
          # --- la apuesta de Moss el Mercader ---
          test -f src/Persistence/Initialization/VersionSeasonSix/Items/MossGamble.cs || { echo "falta MossGamble" >&2; exit 1; }
          # tiene que ir DESPUES de NpcInitialization o no encuentra a Moss para colgarle la tienda
          test "$(grep -n 'new MossGamble(this.Context' src/Persistence/Initialization/VersionSeasonSix/GameConfigurationInitializer.cs | cut -d: -f1)" -gt "$(grep -n 'new NpcInitialization(this.Context' src/Persistence/Initialization/VersionSeasonSix/GameConfigurationInitializer.cs | cut -d: -f1)" || { echo "MossGamble corre antes que NpcInitialization" >&2; exit 1; }
          # las 65 armas del paquete, repartidas en los cinco boletos, y una rara por boleto
          test "$(grep -c "this.AddDropItem(" src/Persistence/Initialization/VersionSeasonSix/Items/MossGamble.cs)" = "65" || { echo "no son 65 armas en la apuesta de Moss" >&2; exit 1; }
          test "$(grep -c "RareChance)" src/Persistence/Initialization/VersionSeasonSix/Items/MossGamble.cs)" = "5" || { echo "no hay una rara por boleto" >&2; exit 1; }
          # y el plugin para la base que ya existe, sin chocar de version
          test -f src/Persistence/Initialization/Updates/AddElementalSystemUpdatePlugIn.cs || { echo "falta el plugin de actualizacion del sistema elemental" >&2; exit 1; }
          grep -q "AddElementalSystem = 118" src/Persistence/Initialization/Updates/UpdateVersion.cs || { echo "la version del plugin elemental choca" >&2; exit 1; }

      - name: Construir la imagen
        working-directory: OpenMU/src
        run: docker build -f Startup/Dockerfile -t openmu:s8-lab .

      - name: Empaquetar la imagen
        run: |
          docker save openmu:s8-lab | gzip -9 > openmu-s8-lab.tar.gz
          ls -lh openmu-s8-lab.tar.gz
          sha256sum openmu-s8-lab.tar.gz | tee sha256.txt

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: imagen-openmu-s8
          path: |
            openmu-s8-lab.tar.gz
            sha256.txt
          if-no-files-found: error
